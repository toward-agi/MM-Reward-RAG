image_store:
  path: "./data/images"
  
indexers:
  type: "faiss"  # Options: faiss, milvus, qdrant
  faiss:
    index_type: "Cosine"  # L2, IP, Cosine, HNSW
    dimension: 
      image: 512
      text: 1536
      jina-clip-v2: 1024
      bge: 1024
      clip-large: 768
      eva-clip: 1280
    nprobe: 16
    metric_type: "Cosine"
    nlinks: 32
    ef_construction: 256
    ef_search: 256
  milvus:
    host: "localhost"
    port: 19530
    collection_name: "mm_rag"
    dimension:
      image: 512 
      text: 1536
    metric_type: "L2"
  qdrant:
    url: "http://localhost:6333"
    collection_name: "mm_rag"
    dimension:
      image: 512
      text: 1536
    distance: "Cosine"

retrieval:
  top_k: 5
  use_reranker: true
  strategy: "full"  # Options: full (img+desc+knowledge), text_only (desc+knowledge), visual (img+knowledge)
  weights:
    multimodal: 0.4
    textual_image: 0.3
    knowledge: 0.3
  reranker:
    type: "cross-encoder"  # Options: cross-encoder, colbert, etc.
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    batch_size: 32
    threshold: 0.5

critic:
  llava_critic:
    type: "llava"
    model: "lmms-lab/llava-critic-7b"
    model_name: "llava_qwen"
    device_map: "auto"
    batch_size: 2
    temperature: 0
    conv_template: "qwen_1_5"
