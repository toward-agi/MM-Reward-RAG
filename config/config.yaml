embedders:
  multimodal:
    type: "clip"  # Options: clip, chinese-clip, etc.
    models:
      clip:
        name: "openai/clip-vit-large-patch14-336"
      chinese_clip:
        name: "OFA-Sys/chinese-clip-vit-base-patch16"
      eva:
        name: "BAAI/EVA-CLIP-8B"
  
  text:
    type: "openai"  # Options: openai, sentence-transformers, etc.
    models:
      openai:
        name: "text-embedding-3-small"
      sentence_transformers:
        name: "all-MiniLM-L6-v2"

generators:
  description_generator:
    type: "openai"
    url: ""
    api_key: ""
    model: "gpt-4o-mini"
    batch_size: 4
    prompt_file: "prompts/description.yaml"
    generation_config:
      max_tokens: 300
      temperature: 0.7
      top_p: 0.9
      presence_penalty: 0.0
      frequency_penalty: 0.0
      response_format: { "type": "text" }
      seed: 42
      stream: false
    
  query_translator:
    type: "openai"
    url: "http://localhost:12334/v1"
