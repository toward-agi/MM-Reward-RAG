    use_knowledge: true  # Whether to include knowledge in the input
    prompt_file: "prompts/response.yaml"
    generation_config:
      max_tokens: 1000
      temperature: 0.7
      top_p: 0.9
      presence_penalty: 0.2
      frequency_penalty: 0.2
      response_format: { "type": "text" }
      seed: 42
      stream: false

